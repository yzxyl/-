<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Cyber Guild Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/layui@2.9.1/dist/css/layui.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    h2 {
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .layui-table {
      background: #1e293b;
      color: #cbd5e1;
      border-color: #334155;
    }

    .layui-table th {
      background-color: #0f172a !important;
      color: #94a3b8 !important;
    }

    .layui-input {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
    }

    /* 强力高亮：红色背景 + 呼吸动画 */
    .row-duplicate {
      background-color: rgba(220, 38, 38, 0.3) !important;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(220, 38, 38, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
      }
    }

    .row-duplicate input {
      border-color: #ef4444 !important;
    }

    .footer-total {
      color: #f472b6 !important;
      font-size: 1.4em;
      text-align: right;
      padding-right: 20px !important;
    }

    .stats-area {
      margin-top: 20px;
      padding: 20px;
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      white-space: pre-wrap;
      font-family: 'Microsoft YaHei', monospace;
    }
  </style>
</head>

<body>
  <div id="app" class="container">
    <h2>// Guild Financial Matrix</h2>

    <div v-if="duplicateNames.size > 0" class="layui-bg-red"
      style="padding: 15px; margin-bottom: 20px; border-radius: 4px; font-weight: bold;">
      ⚠️ 发现错误：以下成员名称重复出现，请立即修改：{{ Array.from(duplicateNames).join('、') }}
    </div>

    <div style="margin-bottom: 15px; display: flex; gap: 10px;">
      <input v-model="config.date" class="layui-input" placeholder="日期" style="width: 120px;">
      <input v-model="config.time" class="layui-input" placeholder="时间" style="width: 120px;">
      <input v-model="config.host" class="layui-input" placeholder="主持" style="width: 120px;">
      <input v-model="config.penalty" class="layui-input" placeholder="违规罚款" style="flex: 1;">
    </div>

    <div class="table-tools">
      <button @click="addRow" class="layui-btn layui-btn-primary">添加成员</button>
      <button @click="addDynamicCol" class="layui-btn layui-btn-primary" style="color: #fbbf24;">添加新榜单</button>
      <button @click="generateReport" class="layui-btn layui-btn-normal">生成流水详情</button>
    </div>

    <table class="layui-table">
      <thead>
        <tr>
          <th>成员名称</th>
          <th v-for="(n, index) in columnCount" :key="index">榜单{{ index + 1 }}</th>
          <th>本档任务</th>
          <th>收益总计</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(row, rIndex) in rows" :key="rIndex"
          :class="{'row-duplicate': duplicateNames.has(row.name.trim()) && row.name.trim() !== ''}">
          <td><input v-model="row.name" class="layui-input" placeholder="输入名称"></td>
          <td v-for="i in columnCount" :key="i"><input type="number" v-model.number="row.amounts[i-1]"
              class="layui-input"></td>
          <td><input type="text" v-model="row.task" class="layui-input"></td>
          <td style="color: #38bdf8; font-weight: bold;">{{ calculateRowTotal(row).toFixed(0) }}</td>
          <td><button @click="removeRow(rIndex)" class="layui-btn layui-btn-xs layui-btn-danger">移除</button></td>
        </tr>
      </tbody>
    </table>

    <div v-if="reportText" class="stats-area">{{ reportText }}</div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;
    createApp({
      setup() {
        const columnCount = ref(2);
        const rows = ref([{ name: '问茶', amounts: [0, 0], task: '' }, { name: '泠枫', amounts: [0, 0], task: '' }]);
        const config = ref({ date: '26.6.6', time: '14-16', host: '问茶', penalty: '羊朹 罚款已交' });
        const reportText = ref('');
        const duplicateNames = ref(new Set());

        // 实时监控变化，自动检测重复
        const checkDuplicates = () => {
          const names = [];
          const dupes = new Set();
          rows.value.forEach(row => {
            const name = row.name.trim();
            if (name && names.includes(name)) dupes.add(name);
            if (name) names.push(name);
          });
          duplicateNames.value = dupes;
        };

        // 每当数据变化时检测重复
        const addRow = () => { rows.value.push({ name: '', amounts: new Array(columnCount.value).fill(0), task: '' }); checkDuplicates(); };
        const removeRow = (index) => { rows.value.splice(index, 1); checkDuplicates(); };
        const addDynamicCol = () => { columnCount.value++; rows.value.forEach(row => row.amounts.push(0)); };

        // 使用 watchEffect 或在点击生成前检测
        const calculateRowTotal = (row) => row.amounts.reduce((sum, val) => sum + (Number(val) || 0), 0);

        const generateReport = () => {
          checkDuplicates(); // 执行一次强制检测
          if (duplicateNames.value.size > 0) {
            alert("⚠️ 无法生成！请先处理红色高亮显示的重复成员。");
            return;
          }

          let report = `✨流水详情✨\n日期：${config.value.date}\n时间：${config.value.time}\n主持：${config.value.host}\n`;
          report += `══════════════\n`;
          rows.value.forEach(row => { report += `${row.name || '未命名'}${calculateRowTotal(row)}\n`; });
          report += `══════════════\n任务详情：无\n══════════════\n违规罚款：${config.value.penalty}`;
          reportText.value = report;
        };

        return { columnCount, rows, config, duplicateNames, addRow, removeRow, addDynamicCol, calculateRowTotal, reportText, generateReport };
      }
    }).mount('#app');
  </script>
</body>

</html>
