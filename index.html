<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Cyber Guild Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/layui@2.9.1/dist/css/layui.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    h2 {
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .layui-table {
      background: #1e293b;
      color: #cbd5e1;
      border-color: #334155;
    }

    .layui-table th {
      background-color: #0f172a !important;
      color: #94a3b8 !important;
    }

    .layui-input {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
    }

    .hint-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid #f59e0b;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      color: #fbbf24;
    }

    .row-duplicate {
      background-color: rgba(245, 158, 11, 0.2) !important;
      transition: all 0.3s;
    }

    .row-duplicate input {
      border-color: #f59e0b !important;
    }

    .stats-area {
      margin-top: 20px;
      padding: 20px;
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      white-space: pre-wrap;
      font-family: 'Microsoft YaHei', monospace;
    }
  </style>
</head>

<body>
  <div id="app" class="container">
    <h2>// Guild Financial Matrix</h2>

    <div v-if="duplicateNames.size > 0" class="hint-box">
      <strong>✨ 小提示：</strong> 发现有成员重复啦，请看表格中橙色的部分，核对后再生成流水哦～
    </div>

    <div
      style="background: #0f172a; padding: 20px; margin-bottom: 20px; border-radius: 8px; border: 1px dashed #475569;">
      <div class="layui-form-item" style="margin-bottom: 0;">
        <label class="layui-form-label"
          style="width: 100px; color: #94a3b8; padding: 9px 0; text-align: left;">快速导入：</label>
        <div class="layui-input-inline" style="width: 50%;">
          <input v-model="importText" class="layui-input" placeholder="例如：@良辰 @洛兮 或 @良辰@洛兮">
        </div>
        <button @click="batchImport" class="layui-btn layui-btn-primary" style="margin-left: 10px;">执行导入</button>
      </div>
    </div>

    <div style="margin-bottom: 15px; display: flex; gap: 10px;">
      <input v-model="config.date" class="layui-input" placeholder="日期" style="width: 120px;">
      <input v-model="config.time" class="layui-input" placeholder="时间" style="width: 120px;">
      <input v-model="config.host" class="layui-input" placeholder="主持" style="width: 120px;">
      <input v-model="config.penalty" class="layui-input" placeholder="违规罚款" style="flex: 1;">
    </div>

    <div class="table-tools">
      <button @click="addRow" class="layui-btn layui-btn-primary">添加成员</button>
      <button @click="addDynamicCol" class="layui-btn layui-btn-primary" style="color: #fbbf24;">添加新榜单</button>
      <button @click="generateReport" class="layui-btn layui-btn-normal">生成流水详情</button>
    </div>

    <table class="layui-table">
      <thead>
        <tr>
          <th>成员名称</th>
          <th v-for="i in columnCount" :key="i">
            榜单{{ i }} <button v-if="i > 2" @click="removeDynamicCol(i-1)" class="layui-btn layui-btn-xs"
              style="background:transparent; color:#f87171;">[X]</button>
          </th>
          <th>本档任务</th>
          <th>收益总计</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(row, rIndex) in rows" :key="rIndex"
          :class="{'row-duplicate': duplicateNames.has(row.name.trim()) && row.name.trim() !== ''}">
          <td><input v-model="row.name" class="layui-input" placeholder="输入名称"></td>
          <td v-for="i in columnCount" :key="i"><input type="number" v-model.number="row.amounts[i-1]"
              class="layui-input"></td>
          <td><input type="text" v-model="row.task" class="layui-input"></td>
          <td style="color: #38bdf8; font-weight: bold;">{{ calculateRowTotal(row).toFixed(0) }}</td>
          <td><button @click="removeRow(rIndex)" class="layui-btn layui-btn-xs layui-btn-danger">移除</button></td>
        </tr>
      </tbody>
    </table>

    <div v-if="reportText" class="stats-area">{{ reportText }}</div>
  </div>

  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const columnCount = ref(2);
        // 修改：初始人员设为空数组
        const rows = ref([]);
        const importText = ref('');
        const config = ref({ date: '26.6.6', time: '14-16', host: '问茶', penalty: '羊朹 罚款已交' });
        const reportText = ref('');
        const duplicateNames = ref(new Set());

        const checkDuplicates = () => {
          const names = [];
          const dupes = new Set();
          rows.value.forEach(row => {
            const name = row.name.trim();
            if (name && names.includes(name)) dupes.add(name);
            if (name) names.push(name);
          });
          duplicateNames.value = dupes;
        };

        const batchImport = () => {
          const sanitizedText = importText.value.replace(/@/g, ' @');
          const regex = /@(\S+)/g;
          let match;
          while ((match = regex.exec(sanitizedText)) !== null) {
            let name = match[1].replace(/[、，。！\s]/g, '');
            if (name && !rows.value.find(r => r.name === name)) {
              rows.value.push({ name: name, amounts: new Array(columnCount.value).fill(0), task: '' });
            }
          }
          importText.value = '';
          checkDuplicates();
        };

        const addRow = () => { rows.value.push({ name: '', amounts: new Array(columnCount.value).fill(0), task: '' }); };
        const removeRow = (index) => { rows.value.splice(index, 1); checkDuplicates(); };
        const addDynamicCol = () => { columnCount.value++; rows.value.forEach(row => row.amounts.push(0)); };
        const removeDynamicCol = (index) => { columnCount.value--; rows.value.forEach(row => row.amounts.splice(index, 1)); };

        const calculateRowTotal = (row) => row.amounts.reduce((sum, val) => sum + (Number(val) || 0), 0);

        const generateReport = () => {
          checkDuplicates();
          if (duplicateNames.value.size > 0) return;
          let report = `✨流水详情✨\n日期：${config.value.date}\n时间：${config.value.time}\n主持：${config.value.host}\n`;
          report += `══════════════\n`;
          rows.value.forEach(row => {
            report += `${row.name || '未命名'}  ${calculateRowTotal(row)}\n`;
          });
          report += `══════════════\n任务详情：无\n══════════════\n违规罚款：${config.value.penalty}`;
          reportText.value = report;
        };

        return { columnCount, rows, importText, config, duplicateNames, batchImport, addRow, removeRow, addDynamicCol, removeDynamicCol, calculateRowTotal, reportText, generateReport };
      }
    }).mount('#app');
  </script>
</body>

</html>
